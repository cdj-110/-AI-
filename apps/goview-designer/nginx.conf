server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 构建已生成 .gz 文件，优先直接提供压缩资源。
  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json text/css image/svg+xml;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:3100;

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # 仅带内容哈希的构建资源可永久缓存；固定文件名仍需校验更新。
  location ~* "^/(?:static|assets)/.*-[a-zA-Z0-9_-]{8}\.(?:js|css|woff2?|png|jpe?g|svg|webp)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /monacoeditorwork/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /api/ {
    client_max_body_size 10m;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}

